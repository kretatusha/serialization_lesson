[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serialization-examples"
version = "0.1.0"
description = "Примеры сериализации и валидации данных на Python"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.25,<5",
    "pydantic>=2.12,<3",
    "python-json-logger>=4.2,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "simple_examples*",
    "task*",
    "validation_examples*",
]
exclude = ["venv*"]